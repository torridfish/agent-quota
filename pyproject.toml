[project]
name = "agent-quota"
version = "0.1.0"
description = "Terminal quota tracker for subscription and rate-limited AI products, with optional balance views"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["claude", "chatgpt", "codex", "copilot", "github", "usage", "monitor", "opencode", "zen", "go", "zai", "tui"]
authors = [
    { name = "torridfish" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "browser-cookie3>=0.20.1",
    "curl-cffi>=0.13.0",
    "rich>=13.7.0",
]

[project.scripts]
agent-quota = "agent_quota:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_quota.py", "common.py", "providers"]

[dependency-groups]
dev = []
